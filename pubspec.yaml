name: mutralo_mobile
description: Application mobile MUTRALO RESTO — gestion des tickets repas
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Réseau / API
  dio: ^5.4.3

  # Stockage sécurisé des tokens JWT
  flutter_secure_storage: ^9.2.2

  # Gestion d'état (auth, rôle, session)
  provider: ^6.1.2

  # QR code : génération (client) et scan (gestionnaire)
  qr_flutter: ^4.1.0
  # Version verrouillée volontairement : 5.2+ et 6.x provoquent un crash
  # natif (genericError / getClass() sur objet nul) sur certains chipsets
  # MediaTek d'entrée de gamme (confirmé sur Tecno CG7). Ne pas upgrader
  # sans retester sur ce device.
  mobile_scanner: 5.1.1

  permission_handler: ^11.3.0

  # Dates
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0E8F49"
  adaptive_icon_foreground: "assets/icon/icon.png"